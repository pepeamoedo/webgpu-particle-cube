<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Native WASM Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040406;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(12, 12, 18, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px 24px;
            pointer-events: auto; /* Cambiado a auto para permitir clics e interactividad */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 280px;
            z-index: 10;
        }
        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .control-group {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-group label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.5);
        }
        .control-group input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.12);
            outline: none;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            box-shadow: 0 0 6px #00e5ff;
            transition: transform 0.1s;
        }
        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }
        .tech-badge {
            display: inline-block;
            margin-top: 18px;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.72rem;
            color: #00e5ff;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <h1>WebGPU Engine</h1>
        <p>Volumetric 3D Particle Cube</p>
        
        <div class="control-group">
            <label for="size-slider">Tamaño Partículas</label>
            <input type="range" id="size-slider" min="0.002" max="0.015" step="0.0005" value="0.005">
        </div>
        
        <div class="control-group">
            <label for="spacing-slider">Espaciado del Cubo</label>
            <input type="range" id="spacing-slider" min="0.3" max="2.0" step="0.05" value="1.0">
        </div>
        
        <div class="control-group">
            <label for="light-slider">Intensidad Brillo</label>
            <input type="range" id="light-slider" min="0.1" max="2.0" step="0.05" value="0.8">
        </div>
        
        <span class="tech-badge">Direct-to-metal rendering</span>
    </div>
    
    <canvas id="canvas"></canvas>

    <script type="module">
        // Monkey-patch GPUAdapter.prototype.requestDevice para evitar la caída por el límite obsoleto en Chrome 135+
        if (typeof GPUAdapter !== "undefined" && GPUAdapter.prototype.requestDevice) {
            const originalRequestDevice = GPUAdapter.prototype.requestDevice;
            GPUAdapter.prototype.requestDevice = function (descriptor) {
                if (descriptor && descriptor.requiredLimits) {
                    delete descriptor.requiredLimits.maxInterStageShaderComponents;
                }
                return originalRequestDevice.call(this, descriptor);
            };
            console.log("WebGPU monkey-patch para 'maxInterStageShaderComponents' aplicado con éxito.");
        }

        // Monkey-patch GPUDevice.prototype.createShaderModule para capturar y formatear errores de compilación
        if (typeof GPUDevice !== "undefined" && GPUDevice.prototype.createShaderModule) {
            const originalCreateShaderModule = GPUDevice.prototype.createShaderModule;
            GPUDevice.prototype.createShaderModule = function (descriptor) {
                const shaderModule = originalCreateShaderModule.call(this, descriptor);
                if (descriptor && descriptor.code) {
                    const label = descriptor.label || "Unnamed Shader";
                    const code = descriptor.code;
                    shaderModule.getCompilationInfo().then((info) => {
                        if (info.messages && info.messages.length > 0) {
                            const hasErrors = info.messages.some(msg => msg.type === "error");
                            if (hasErrors) {
                                console.error(`%c--- Error de Compilación en Shader "${label}" ---`, "color: #ff3366; font-weight: bold; font-size: 14px;");
                            } else {
                                console.warn(`%c--- Advertencias de Compilación en Shader "${label}" ---`, "color: #ffaa00; font-weight: bold; font-size: 14px;");
                            }
                            
                            const lines = code.split("\n");
                            info.messages.forEach((msg) => {
                                const typeColor = msg.type === "error" ? "#ff3333" : msg.type === "warning" ? "#ffaa00" : "#00aaff";
                                console.error(
                                    `%c[${msg.type.toUpperCase()}] Línea ${msg.lineNum}:${msg.linePos} - ${msg.message}`,
                                    `color: ${typeColor}; font-weight: bold;`
                                );
                                
                                // Mostrar contexto de la línea de error
                                const startLine = Math.max(1, msg.lineNum - 3);
                                const endLine = Math.min(lines.length, msg.lineNum + 3);
                                for (let i = startLine; i <= endLine; i++) {
                                    const isErrorLine = i === msg.lineNum;
                                    const lineText = lines[i - 1];
                                    const prefix = isErrorLine ? `>> ${i}: ` : `   ${i}: `;
                                    const style = isErrorLine ? "color: #ff3333; background: #220000; font-weight: bold; font-family: monospace;" : "color: #888888; font-family: monospace;";
                                    console.error(`%c${prefix}${lineText}`, style);
                                    if (isErrorLine) {
                                        const padding = " ".repeat(prefix.length + msg.linePos - 1);
                                        console.error(`%c${padding}^`, "color: #ff3333; font-weight: bold; font-family: monospace;");
                                    }
                                }
                            });
                        }
                    }).catch(err => {
                        console.error("Error al obtener información de compilación del shader:", err);
                    });
                }
                return shaderModule;
            };
            console.log("WebGPU monkey-patch para 'createShaderModule' de captura de errores cargado.");
        }

        import init from "./pkg/webgpu_wasm_triangle.js";
        
        async function run() {
            try {
                await init();
                console.log("Módulo WASM inicializado con éxito.");
            } catch (err) {
                console.error("Error al inicializar el módulo WASM:", err);
            }
        }
        
        run();
    </script>
</body>
</html>
